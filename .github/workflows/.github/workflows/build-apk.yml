name: Build Yans Market APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'yans_market_android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack app
        run: unzip -o yans_market_android.zip -d .
      - name: Install dependencies
        working-directory: yans_market
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: yans_market
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: yans_market/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YansMarket-APK
          path: yans_market/android/app/build/outputs/apk/debug/app-debug.apk
